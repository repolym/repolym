<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repolym</title>
  <link rel="icon" type="image/png" href="/repolym/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    // Apply the saved theme before React loads (no flash). Consultants are always light.
    (function () {
      try {
        var stored = localStorage.getItem('repolym-theme');
        var theme = stored && ['light', 'dark', 'sepia', 'system'].indexOf(stored) !== -1 ? stored : 'system';
        var resolved = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        if (localStorage.getItem('repolym-force-light') === '1') resolved = 'light';
        var root = document.documentElement;
        if (resolved === 'dark') root.classList.add('dark');
        else if (resolved === 'sepia') root.classList.add('theme-sepia');
      } catch (e) { }
    })();
  </script>
</head>

<body class="bg-[#FAFAFA] text-[#111827]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
